# ─────────────────────────────────────────────────────────────────────────────
# Jobaton OSS — GitLab CI → Docker Hub
#
# This private pipeline mirrors vetted code from the public GitHub repo
# and builds/pushes Docker images to Docker Hub (nepica/jobaton).
#
# Triggers:
#   - Push to main   → build only (verify)
#   - Version tags   → build + push to Docker Hub
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - build
  - push

variables:
  DOCKER_IMAGE: nepica/jobaton
  DOCKER_TLS_CERTDIR: "/certs"

# ── Build (verify on every push) ────────────────────────────────────────────
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t $DOCKER_IMAGE:ci-$CI_COMMIT_SHORT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

# ── Push to Docker Hub (only on version tags) ───────────────────────────────
push:
  stage: push
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_TAG -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_TAG
    - docker push $DOCKER_IMAGE:latest
    # Also push major.minor tag (e.g., v1.2.3 → 1.2)
    - |
      VERSION=$(echo $CI_COMMIT_TAG | sed 's/^v//')
      MINOR=$(echo $VERSION | cut -d. -f1-2)
      docker tag $DOCKER_IMAGE:$CI_COMMIT_TAG $DOCKER_IMAGE:$MINOR
      docker push $DOCKER_IMAGE:$MINOR
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
